name: Release archive of provider binary

on:
  push:
    # trigger release only by pushing a tag
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.name_of_branch.outputs.TAG_NAME }}
    steps:
      - name: Name of branch
        id: name_of_branch
        run: |
          echo TAG_NAME="${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"

      # terraform-plugin-testing looks for a Terraform CLI on PATH first and
      # only falls back to downloading+GPG-verifying a release from
      # releases.hashicorp.com if none is found. HashiCorp's old release
      # signing key has since expired, which breaks that download fallback.
      # Installing the CLI here keeps tests on the PATH lookup and avoids it.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Run tests
        run: |
          make test

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ""

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version:  '~> v2'
          args: release --clean --timeout 45m
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GH_RELEASER_TOKEN }}
